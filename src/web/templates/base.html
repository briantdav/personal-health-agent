<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>{% block title %}Personal Health Portal{% endblock %}</title>
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="icon" href="/static/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/static/icons/icon-180.png" />
  <meta name="theme-color" content="#f3f2f2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Health Portal" />
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="/static/modernist.css" />
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}

  <nav class="mn-tabs" aria-label="Sections">
    <a class="mn-tab {{ 'active' if active_tab == 'today' }}" href="/">TODAY</a>
    <a class="mn-tab {{ 'active' if active_tab == 'recover' }}" href="/#recovery">RECOVER</a>
    <a class="mn-tab {{ 'active' if active_tab == 'train' }}" href="/#training">TRAIN</a>
    <a class="mn-tab {{ 'active' if active_tab == 'trends' }}" href="/trends">TRENDS</a>
    <a class="mn-tab {{ 'active' if active_tab == 'review' }}" href="/review">REVIEW</a>
  </nav>

  <script>
    // Shared across every page: theme (persisted, defaults to system
    // preference) and service-worker registration. Page-specific behavior
    // lives in each template's own "scripts" block.
    const root = document.documentElement;
    const stored = localStorage.getItem("theme");
    if (stored) root.setAttribute("data-theme", stored);

    const themeToggle = document.getElementById("theme-toggle");
    if (themeToggle) {
      themeToggle.addEventListener("click", () => {
        const current = root.getAttribute("data-theme")
          || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        const next = current === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
      });
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/static/sw.js").catch(() => {});
      });
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
